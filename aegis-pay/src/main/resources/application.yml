spring:
  application:
    name: aegis-pay

  # Java 21 Virtual Threads for Tomcat request handling & @Async
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/aegispay
    username: ${DB_USER:aegispay}
    password: ${DB_PASSWORD:aegispay}
    hikari:
      maximum-pool-size: 20
      # Virtual threads can block on JDBC — keep pool bounded; pinning is acceptable for JDBC (connection pool is the limiter)

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis

  kafka:
    bootstrap-servers: localhost:9092
    listener:
      ack-mode: manual            # remediation acks only after the aggregate transition commits
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        compression.type: zstd
    consumer:
      group-id: aegis-pay
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.aegispay.*
        isolation.level: read_committed
        allow.auto.create.topics: false

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o
          temperature: 0.1
          max-tokens: 512
      embedding:
        options:
          model: text-embedding-3-small
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.1:8b
          temperature: 0.1
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        remove-existing-vector-store-table: false
        initialize-schema: false   # schema owned by Flyway

  modulith:
    republish-outstanding-events-on-restart: false # we own the outbox via Debezium-style relay below

server:
  port: 8080
  tomcat:
    threads:
      max: 200            # platform threads for acceptors only; workers are virtual
    accept-count: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,modulith
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

aegis:
  ingestion:
    rate-limit:
      requests-per-minute-per-user: 120
  risk-engine:
    threshold: 75
    fast-model-max-score: 40   # scores at/below this from Ollama skip the OpenAI deep-pass
  outbox:
    relay:
      poll-interval: 500ms
      batch-size: 100
  topics:
    transaction-recorded: aegis.transaction.v1
    risk-evaluated: aegis.risk.v1
    remediation-executed: aegis.remediation.v1

resilience4j:
  circuitbreaker:
    instances:
      llm-openai:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        fallback: no-op
      ip-reputation:
        sliding-window-size: 20
        failure-rate-threshold: 60
        wait-duration-in-open-state: 15s
  retry:
    instances:
      ip-reputation:
        max-attempts: 3
        wait-duration: 200ms
  timelimiter:
    instances:
      llm-openai:
        timeout-duration: 3s
